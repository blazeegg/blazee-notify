<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>blazee-notify</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <main id="notification-root" aria-live="polite">
        <section class="notify-stack top-left" data-position="top-left"></section>
        <section class="notify-stack top-center" data-position="top-center"></section>
        <section class="notify-stack top-right" data-position="top-right"></section>
        <section class="notify-stack middle-left" data-position="middle-left"></section>
        <section class="notify-stack middle-right" data-position="middle-right"></section>
        <section class="notify-stack bottom-left" data-position="bottom-left"></section>
        <section class="notify-stack bottom-center" data-position="bottom-center"></section>
        <section class="notify-stack bottom-right" data-position="bottom-right"></section>
    </main>
    <script src="app.js"></script>
</body>
</html>
